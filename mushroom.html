<style>
  :root {
    --bg: #f5efe2;
    --bg-soft: #efe8d8;
    --card: #fffdf7;
    --card-border: #e7ddc8;
    --ink: #2b2820;
    --muted: #948d7a;
    --muted-soft: #b6ae99;
    --accent: #33473b;
    --accent-strong: #24352b;
    --accent-tint: #e3e9e0;
    --mark: #c24e2f;
    --line: #ddd3ba;
    --shadow: 0 1px 2px rgba(43,40,32,0.04), 0 6px 16px -8px rgba(43,40,32,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17160f;
      --bg-soft: #1e1c14;
      --card: #221f16;
      --card-border: #34301f;
      --ink: #ece5d3;
      --muted: #948c76;
      --muted-soft: #6d6752;
      --accent: #6f9678;
      --accent-strong: #86ac8e;
      --accent-tint: #26332a;
      --mark: #e2825e;
      --line: #3a3524;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px -10px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17160f;
    --bg-soft: #1e1c14;
    --card: #221f16;
    --card-border: #34301f;
    --ink: #ece5d3;
    --muted: #948c76;
    --muted-soft: #6d6752;
    --accent: #6f9678;
    --accent-strong: #86ac8e;
    --accent-tint: #26332a;
    --mark: #e2825e;
    --line: #3a3524;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px -10px rgba(0,0,0,0.5);
  }
  :root[data-theme="light"] {
    --bg: #f5efe2;
    --bg-soft: #efe8d8;
    --card: #fffdf7;
    --card-border: #e7ddc8;
    --ink: #2b2820;
    --muted: #948d7a;
    --muted-soft: #b6ae99;
    --accent: #33473b;
    --accent-strong: #24352b;
    --accent-tint: #e3e9e0;
    --mark: #c24e2f;
    --line: #ddd3ba;
    --shadow: 0 1px 2px rgba(43,40,32,0.04), 0 6px 16px -8px rgba(43,40,32,0.10);
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg-soft);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    min-height: 100%;
  }

  .frame {
    width: 100%;
    max-width: 460px;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Header ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(20px + env(safe-area-inset-top)) 20px 14px;
    flex-shrink: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .brand svg { flex-shrink: 0; }
  .icon-btn {
    -webkit-tap-highlight-color: transparent;
    appearance: none;
    background: none;
    border: none;
    padding: 8px;
    margin: -8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    cursor: pointer;
    border-radius: 10px;
  }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon-btn svg { width: 22px; height: 22px; }

  .text-btn {
    -webkit-tap-highlight-color: transparent;
    appearance: none;
    background: none;
    border: none;
    font-size: 16px;
    font-weight: 600;
    color: var(--mark);
    cursor: pointer;
    padding: 8px;
    margin: -8px;
    border-radius: 8px;
    font-family: inherit;
  }
  .text-btn:disabled { color: var(--muted-soft); cursor: default; }
  .text-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .compose-title {
    font-size: 16px;
    font-weight: 700;
  }

  /* ---------- Views ---------- */
  .view {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  [hidden] { display: none !important; }

  /* ---------- Feed ---------- */
  #view-feed .scroll {
    flex: 1;
    overflow-y: auto;
    padding: 4px 16px 100px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .empty-state {
    margin-top: 22vh;
    text-align: center;
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.7;
    padding: 0 40px;
  }
  .empty-state .spore {
    font-size: 26px;
    display: block;
    margin-bottom: 10px;
    opacity: 0.7;
  }

  .post-card {
    -webkit-tap-highlight-color: transparent;
    text-align: left;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 18px 18px 16px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    font-family: inherit;
    color: inherit;
    display: block;
  }
  .post-card:active { transform: scale(0.985); }
  .post-card:hover { border-color: var(--line); }
  .post-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .post-date {
    font-size: 12.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-bottom: 9px;
    letter-spacing: 0.01em;
  }
  .post-body {
    font-size: 16.5px;
    line-height: 1.62;
    font-weight: 500;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .post-meta {
    margin-top: 12px;
    font-size: 12.5px;
    color: var(--muted-soft);
  }

  .fab {
    -webkit-tap-highlight-color: transparent;
    position: absolute;
    right: 20px;
    bottom: 28px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px -4px rgba(36,53,43,0.45);
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .fab:hover { background: var(--accent-strong); }
  .fab:active { transform: scale(0.93); }
  .fab:focus-visible { outline: 2px solid var(--mark); outline-offset: 3px; }
  .fab svg { width: 22px; height: 22px; }

  /* ---------- Detail ---------- */
  .detail-header {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: calc(18px + env(safe-area-inset-top)) 16px 12px;
    flex-shrink: 0;
  }
  .detail-header .icon-btn { position: absolute; left: 12px; }
  .detail-date {
    font-size: 16px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  #view-detail .scroll {
    flex: 1;
    overflow-y: auto;
    padding: 6px 20px 24px;
  }

  .origin-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 20px 20px;
    box-shadow: var(--shadow);
    font-size: 16.5px;
    line-height: 1.68;
    font-weight: 500;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .timeline {
    position: relative;
    margin-top: 26px;
    padding-left: 22px;
  }
  .timeline::before {
    content: "";
    position: absolute;
    left: 5px;
    top: 6px;
    bottom: 6px;
    width: 1px;
    background: var(--line);
  }
  .timeline-item {
    position: relative;
    margin-bottom: 20px;
  }
  .timeline-item:last-child { margin-bottom: 4px; }
  .timeline-dot {
    position: absolute;
    left: -22px;
    top: 7px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
  }
  .timeline-date {
    font-size: 12.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-bottom: 6px;
  }
  .timeline-body {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .timeline-empty {
    margin-top: 22px;
    color: var(--muted-soft);
    font-size: 13.5px;
    text-align: center;
    padding: 10px 0 4px;
  }

  .comment-bar {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
    border-top: 1px solid var(--card-border);
    background: var(--bg);
  }
  .comment-input {
    flex: 1;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    background: var(--bg-soft);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 11px 16px;
    outline: none;
    min-width: 0;
  }
  .comment-input::placeholder { color: var(--muted-soft); }
  .comment-input:focus { border-color: var(--accent); }

  .send-btn {
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 20px;
    padding: 11px 18px;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .send-btn:hover { background: var(--accent-strong); }
  .send-btn:disabled { opacity: 0.4; cursor: default; }
  .send-btn:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }

  /* ---------- Compose ---------- */
  .compose-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(18px + env(safe-area-inset-top)) 12px 12px 16px;
    flex-shrink: 0;
  }
  #view-compose .scroll {
    flex: 1;
    padding: 8px 20px 20px;
    display: flex;
  }
  .compose-date {
    font-size: 12.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    padding: 0 2px 12px;
  }
  .compose-area {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .compose-textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--card-border);
    background: var(--card);
    border-radius: 16px;
    padding: 18px;
    font-family: inherit;
    font-size: 16.5px;
    line-height: 1.65;
    color: var(--ink);
    outline: none;
    box-shadow: var(--shadow);
    min-height: 200px;
  }
  .compose-textarea::placeholder { color: var(--muted-soft); }
  .compose-textarea:focus { border-color: var(--accent); }

  /* transitions */
  .view { animation: fade-in 0.16s ease; }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .view, .post-card, .fab { animation: none !important; transition: none !important; }
  }

  ::-webkit-scrollbar { width: 0; height: 0; }
</style>

<div class="frame">

  <!-- ===== FEED ===== -->
  <section class="view" id="view-feed">
    <header class="topbar">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M4 11.5C4 7.5 7.6 4 12 4C16.4 4 20 7.5 20 11.5C20 12.9 18.9 13.5 17.5 13C16.3 12.6 15.5 13.3 15.5 14.5V15.5C15.5 17 14.2 18 12 18C9.8 18 8.5 17 8.5 15.5V14.5C8.5 13.3 7.7 12.6 6.5 13C5.1 13.5 4 12.9 4 11.5Z" fill="var(--mark)"/>
          <path d="M9.5 18L9 21M14.5 18L15 21" stroke="var(--mark)" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        머쉬룸
      </div>
      <button class="icon-btn" id="theme-toggle" title="테마 전환" aria-label="테마 전환">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
      </button>
    </header>

    <div class="scroll" id="feed-scroll">
      <div class="empty-state" id="empty-state" hidden>
        <span class="spore">🍄</span>
        아직 남긴 글이 없어요.<br>지금 떠오른 생각을 적어보세요.
      </div>
      <div id="post-list"></div>
    </div>

    <button class="fab" id="fab-new" aria-label="새 글 쓰기">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
  </section>

  <!-- ===== DETAIL ===== -->
  <section class="view" id="view-detail" hidden>
    <div class="detail-header">
      <button class="icon-btn" id="detail-back" aria-label="뒤로">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div class="detail-date" id="detail-date"></div>
    </div>
    <div class="scroll">
      <div class="origin-card" id="detail-body"></div>
      <div class="timeline" id="detail-timeline"></div>
      <div class="timeline-empty" id="timeline-empty" hidden>아직 남긴 댓글이 없어요.</div>
    </div>
    <form class="comment-bar" id="comment-form">
      <input class="comment-input" id="comment-input" type="text" placeholder="지금의 생각을 댓글로 남기기" autocomplete="off" maxlength="800">
      <button class="send-btn" id="comment-submit" type="submit" disabled>등록</button>
    </form>
  </section>

  <!-- ===== COMPOSE ===== -->
  <section class="view" id="view-compose" hidden>
    <div class="compose-header">
      <button class="icon-btn" id="compose-close" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="compose-title">새 글</div>
      <button class="text-btn" id="compose-submit" disabled>게시</button>
    </div>
    <div class="scroll">
      <div class="compose-area">
        <div class="compose-date" id="compose-date"></div>
        <textarea class="compose-textarea" id="compose-textarea" placeholder="지금 떠오른 것을 자유롭게 써보세요." maxlength="4000"></textarea>
      </div>
    </div>
  </section>

</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "mushroom_posts_v1";
  var THEME_KEY = "mushroom_theme";

  /* ---------- theme ---------- */
  var savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
  document.getElementById("theme-toggle").addEventListener("click", function () {
    var current = document.documentElement.getAttribute("data-theme");
    var isDark = current
      ? current === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = isDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem(THEME_KEY, next);
  });

  /* ---------- data ---------- */
  function loadPosts() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }
  function savePosts(posts) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
  }
  var posts = loadPosts();

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function fmtDate(iso) {
    var d = new Date(iso);
    return d.getFullYear() + ". " + (d.getMonth() + 1) + ". " + d.getDate() + ".";
  }

  /* ---------- view switching ---------- */
  var views = {
    feed: document.getElementById("view-feed"),
    detail: document.getElementById("view-detail"),
    compose: document.getElementById("view-compose")
  };
  var activePostId = null;

  function showView(name) {
    Object.keys(views).forEach(function (k) {
      views[k].hidden = k !== name;
    });
  }

  /* ---------- feed rendering ---------- */
  var postList = document.getElementById("post-list");
  var emptyState = document.getElementById("empty-state");

  function renderFeed() {
    postList.innerHTML = "";
    var sorted = posts.slice().sort(function (a, b) {
      return new Date(b.date) - new Date(a.date);
    });
    emptyState.hidden = sorted.length !== 0;
    sorted.forEach(function (post) {
      var card = document.createElement("button");
      card.className = "post-card";
      card.type = "button";

      var dateEl = document.createElement("div");
      dateEl.className = "post-date";
      dateEl.textContent = fmtDate(post.date);

      var bodyEl = document.createElement("div");
      bodyEl.className = "post-body";
      bodyEl.textContent = post.body;

      card.appendChild(dateEl);
      card.appendChild(bodyEl);

      if (post.comments.length > 0) {
        var meta = document.createElement("div");
        meta.className = "post-meta";
        meta.textContent = "댓글 " + post.comments.length;
        card.appendChild(meta);
      }

      card.addEventListener("click", function () {
        openDetail(post.id);
      });
      postList.appendChild(card);
    });
  }

  /* ---------- detail rendering ---------- */
  var detailDate = document.getElementById("detail-date");
  var detailBody = document.getElementById("detail-body");
  var detailTimeline = document.getElementById("detail-timeline");
  var timelineEmpty = document.getElementById("timeline-empty");
  var commentInput = document.getElementById("comment-input");
  var commentSubmit = document.getElementById("comment-submit");
  var feedScroll = document.getElementById("feed-scroll");

  function findPost(id) {
    for (var i = 0; i < posts.length; i++) {
      if (posts[i].id === id) return posts[i];
    }
    return null;
  }

  function openDetail(id) {
    activePostId = id;
    renderDetail();
    showView("detail");
  }

  function renderDetail() {
    var post = findPost(activePostId);
    if (!post) { showView("feed"); return; }
    detailDate.textContent = fmtDate(post.date);
    detailBody.textContent = post.body;

    detailTimeline.innerHTML = "";
    timelineEmpty.hidden = post.comments.length !== 0;
    post.comments.forEach(function (c) {
      var item = document.createElement("div");
      item.className = "timeline-item";

      var dot = document.createElement("div");
      dot.className = "timeline-dot";

      var dateEl = document.createElement("div");
      dateEl.className = "timeline-date";
      dateEl.textContent = fmtDate(c.date);

      var bodyEl = document.createElement("div");
      bodyEl.className = "timeline-body";
      bodyEl.textContent = c.body;

      item.appendChild(dot);
      item.appendChild(dateEl);
      item.appendChild(bodyEl);
      detailTimeline.appendChild(item);
    });

    commentInput.value = "";
    commentSubmit.disabled = true;
  }

  document.getElementById("detail-back").addEventListener("click", function () {
    renderFeed();
    showView("feed");
  });

  commentInput.addEventListener("input", function () {
    commentSubmit.disabled = commentInput.value.trim().length === 0;
  });

  document.getElementById("comment-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var text = commentInput.value.trim();
    if (!text) return;
    var post = findPost(activePostId);
    if (!post) return;
    post.comments.push({ id: uid(), date: new Date().toISOString(), body: text });
    savePosts(posts);
    renderDetail();
  });

  /* ---------- compose ---------- */
  var composeDate = document.getElementById("compose-date");
  var composeTextarea = document.getElementById("compose-textarea");
  var composeSubmit = document.getElementById("compose-submit");

  function openCompose() {
    composeDate.textContent = fmtDate(new Date().toISOString());
    composeTextarea.value = "";
    composeSubmit.disabled = true;
    showView("compose");
    setTimeout(function () { composeTextarea.focus(); }, 50);
  }

  document.getElementById("fab-new").addEventListener("click", openCompose);
  document.getElementById("compose-close").addEventListener("click", function () {
    showView("feed");
  });
  composeTextarea.addEventListener("input", function () {
    composeSubmit.disabled = composeTextarea.value.trim().length === 0;
  });
  composeSubmit.addEventListener("click", function () {
    var text = composeTextarea.value.trim();
    if (!text) return;
    var post = { id: uid(), date: new Date().toISOString(), body: text, comments: [] };
    posts.push(post);
    savePosts(posts);
    renderFeed();
    feedScroll.scrollTop = 0;
    showView("feed");
  });

  /* ---------- init ---------- */
  renderFeed();
  showView("feed");
})();
</script>
